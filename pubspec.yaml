name: omni_motorista
description: "Aplicativo Oficial do Motorista OMNI Mobilidade Urbana - Tema Neon Luxuoso"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Mapas, GPS e Geolocalização
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  geolocator: ^11.0.0
  geocoding: ^3.0.0
  flutter_compass: ^0.8.0

  # Comunicação em Tempo Real, Push e Backend
  http: ^1.2.0
  firebase_core: ^2.27.0
  firebase_database: ^10.4.9
  firebase_auth: ^4.17.8
  firebase_messaging: ^14.7.19
  flutter_local_notifications: ^17.1.2
  timezone: ^0.9.2

  # Gerenciamento de Estado e Reatividade
  provider: ^6.1.1

  # Armazenamento Seguro e Cache Offline
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2

  # Câmera ao Vivo, Visão Computacional On-Device (ML Kit), OCR e Arquivos
  camera: ^0.10.5+9
  google_mlkit_face_detection: ^0.11.0
  google_mlkit_text_recognition: ^0.13.0
  local_auth: ^2.3.0
  file_picker: ^8.0.0+1
  path_provider: ^2.1.2

  # Interface, Mídia, Áudio e Neon Luxuoso
  lucide_icons: ^0.252.0
  audioplayers: ^6.0.0
  google_fonts: ^6.1.0
  intl: ^0.19.0
  flutter_svg: ^2.0.9
  image_picker: ^1.0.7
  url_launcher: ^6.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

